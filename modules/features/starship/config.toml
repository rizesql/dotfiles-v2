# Inserts a blank line between shell prompts
add_newline = true

format = """
$username\
$nix_shell\
$container\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$nats\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$fill\
$jobs\
$battery\
$time\
$status\
$container\
$os\
$bun$c$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$zig$buf$guix_shell$conda$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$crystal\
$package\
$newline\
$custom
"""

[fill]
symbol = ' '

# Change the default prompt characters
[character]
success_symbol = ""
error_symbol = ""

disabled = false

# Shows the username
[username]
style_user = "bold blue"
style_root = "white"
format = "[$user ]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = true
ssh_symbol = " "
format = "on [$hostname](bold yellow) "
disabled = false

[directory]
truncation_length = 1
home_symbol = "  ~"
read_only_style = "197"
read_only = "  "
format = "at [$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "󰊢 "
format = "on [$symbol$branch]($style) "
# truncation_length = 4
style = "208"
disabled = false

[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold green"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = " "
modified = " "
staged = '[++\($count\)](green)'
renamed = "襁 "
deleted = " "
disabled = true

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = "([+$added]($added_style))( [-$deleted]($deleted_style) )"

# [kubernetes]
# format = 'via [󰠳 $context\($namespace\)](bold purple) '
# disabled = true

# # (deactivated because of no space left)
# #
# # [terraform]
# # format = "via [ terraform $version]($style) 壟 [$workspace]($style) "
# # disabled = true

[docker_context]
format = "via [󰡨 $context](bold blue) "
disabled = true

[dotnet]
disabled = false
symbol = ".NET "

# [helm]
# format = "via [󰠳 $version](bold purple) "
# disabled = true

[nodejs]
format = "via [󰎙 $version](bold green) "
disabled = false

[aws]
symbol = "  "

[buf]
disabled = true

[c]
symbol = " "

[conda]
symbol = " "

[dart]
